services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-medora-root}
      MYSQL_DATABASE: ${DB_NAME:-medora}
      MYSQL_USER: ${DB_USER:-medora}
      MYSQL_PASSWORD: ${DB_PASSWORD:-medora-local}
    ports:
      - "3306:3306"
    volumes:
      - medora_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-medora-root}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  medora_mysql:
